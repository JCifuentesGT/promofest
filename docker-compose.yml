version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: promofest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-promofest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-promofest_pass}
      POSTGRES_DB: ${DB_NAME:-promofest_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-promofest}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promofest_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-promofest}
      DB_PASSWORD: ${DB_PASSWORD:-promofest_pass}
      DB_NAME: ${DB_NAME:-promofest_db}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      EVENT_CAPACITY: ${EVENT_CAPACITY:-50}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promofest_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
